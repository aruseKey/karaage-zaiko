<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#d9771f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="唐揚げ在庫">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>唐揚げ在庫管理</title>
<style>
  :root { --bg:#fff8ef; --card:#fff; --ink:#3a2a1a; --sub:#8a7560; --accent:#d9771f; --line:#f0e2cf; --bad:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 48px; padding-top:max(20px, env(safe-area-inset-top)); }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--sub); font-size:13px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  input, select { width:100%; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:10px; margin:6px 0 10px; background:#fff; color:var(--ink); font-family:inherit; }
  button { width:100%; font-size:16px; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; font-family:inherit; }
  button:disabled { opacity:.5; }
  fieldset { border:0; padding:0; margin:0; min-width:0; }
  label { display:block; font-size:13px; color:var(--sub); }
  .err { color:var(--bad); font-size:13px; min-height:18px; }
  .ok { color:#2e7d32; font-size:13px; min-height:18px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tabs { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; position:sticky; top:0; z-index:2; background:var(--bg); padding:8px 0 12px; }
  .tabs a { display:block; text-align:center; padding:10px 0; border-radius:10px; background:var(--card); border:1px solid var(--line); color:var(--ink); text-decoration:none; font-weight:600; font-size:14px; }
  .tabs a.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .msg { background:#eef4ff; border:1px solid #c9d8f5; border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center; }
  .stat b { display:block; font-size:22px; }
  .stat span { font-size:11px; color:var(--sub); }
  h2 { font-size:14px; color:var(--sub); margin:20px 0 8px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .name { font-weight:600; }
  .bags { font-weight:700; color:var(--accent); white-space:nowrap; }
  .neg { color:var(--bad); }
  .addr { font-size:14px; margin-top:6px; }
  .addr a { color:var(--ink); }
  .none, .flow { font-size:13px; color:var(--sub); margin-top:6px; }
  .note { background:#fff3e0; border-color:#f5c27a; font-size:14px; }
  .note ul { margin:8px 0 0; padding-left:20px; }
  .note li { margin-bottom:4px; }
  .pwrow { display:flex; gap:8px; align-items:center; }
  .pwrow input { margin:8px 0 4px; }
  .pwrow button { width:auto; padding:12px 18px; margin:8px 0 4px; white-space:nowrap; }
  .hist { display:flex; align-items:center; gap:10px; padding:12px 14px; }
  .hist .date { color:var(--sub); font-size:13px; min-width:40px; }
  .hist .what, .tl .what { flex:1; min-width:0; overflow-wrap:anywhere; }
  .undo { width:auto; padding:6px 10px; font-size:12px; font-weight:500; background:#fff; color:var(--bad); border:1px solid #f0c9c4; white-space:nowrap; }
  .undo.armed { background:var(--bad); color:#fff; border-color:var(--bad); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:4px; }
  .chip { width:auto; padding:6px 12px; font-size:13px; font-weight:600; border-radius:999px; background:#fff; color:var(--ink); border:1px solid var(--line); }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .chip.order { margin-left:auto; font-weight:500; }
  .day { display:flex; justify-content:space-between; align-items:baseline; margin:18px 2px 6px; }
  .day b { font-size:15px; }
  .day span { font-size:12px; color:var(--sub); text-align:right; }
  .tl { display:flex; align-items:center; gap:10px; padding:12px 14px; margin-bottom:8px; }
  .tl .time { font-size:12px; color:var(--sub); min-width:32px; text-align:right; }
  .badge { font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .b-buy { background:#e8f5e9; color:#2e7d32; }
  .b-give { background:#fff3e0; color:#c96512; }
  .b-collect { background:#e3f2fd; color:#1565c0; }
  .base { text-align:center; font-size:12px; color:var(--sub); border:1px dashed #e2cfb4; border-radius:12px; padding:10px; margin:16px 0 0; }
  .empty { font-size:13px; color:var(--sub); padding:4px 2px; }
  .foot { font-size:12px; color:var(--sub); text-align:center; margin-top:18px; display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; }
  details { margin-top:12px; border-top:1px solid var(--line); padding-top:8px; }
  summary { font-size:14px; font-weight:600; color:var(--accent); cursor:pointer; padding:6px 0; }
  details form { margin-top:6px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🍗 匠の金賞唐揚げ 在庫管理</h1>
  <p class="sub">だれでも記録できます。住所だけパスワードが必要です。</p>

  <nav class="tabs">
    <a href="#stock" data-view="stock">在庫</a>
    <a href="#buy" data-view="buy">購入</a>
    <a href="#give" data-view="give">分配</a>
    <a href="#collect" data-view="collect">回収</a>
    <a href="#log" data-view="log">履歴</a>
  </nav>
  <div id="msg" class="msg hidden"></div>

  <section id="v-stock" class="view">
    <div class="stats">
      <div class="stat"><b id="sTotal">-</b><span>在庫合計（袋）</span></div>
      <div class="stat"><b id="sFree">-</b><span>手元・未分配</span></div>
      <div class="stat"><b id="sDone">-</b><span>回収済み</span></div>
    </div>
    <div class="card">
      <div id="addrLocked">
        <div class="name">🔒 住所を見る</div>
        <div class="pwrow">
          <input id="addrPw" type="password" placeholder="パスワード" autocomplete="current-password">
          <button id="addrGo" type="button">表示</button>
        </div>
        <div class="err" id="addrErr"></div>
      </div>
      <div id="addrOpen" class="hidden">
        <div class="row">
          <span class="name">🔓 住所を表示しています</span>
          <button id="addrHide" type="button" class="chip">隠す</button>
        </div>
        <details id="addrEdit">
          <summary>住所を登録・変更する</summary>
          <form id="f-addr" autocomplete="off" novalidate>
            <label>家<select name="place"></select></label>
            <label class="hidden" data-role="newWrap">名前<input name="newname" maxlength="30" placeholder="新しく預ける人の名前"></label>
            <label>住所<input name="address" maxlength="100" placeholder="例：八王子市東中野○○-○ ○○ハイツ101号室"></label>
            <div class="err" data-role="err"></div>
            <button type="submit" data-label="登録する">登録する</button>
            <div class="ok" data-role="ok"></div>
          </form>
        </details>
      </div>
    </div>
    <div id="notes"></div>
    <div id="list"></div>
  </section>

  <section id="v-buy" class="view hidden">
    <form id="f-buy" class="card" autocomplete="off" novalidate>
      <fieldset>
        <label>業務スーパーの店名<input name="store" list="storeList" maxlength="30" placeholder="例：〇〇店"></label>
        <datalist id="storeList"></datalist>
        <div class="two">
          <label>袋数<input name="bags" type="number" inputmode="numeric" min="1" max="999" step="1"></label>
          <label>購入日<input name="date" type="date"></label>
        </div>
        <div class="err" data-role="err"></div>
        <button type="submit" data-label="購入を記録する">購入を記録する</button>
        <div class="ok" data-role="ok"></div>
      </fieldset>
    </form>
    <h2>購入の記録 <span id="sum-buy"></span></h2>
    <div id="h-buy"></div>
  </section>

  <section id="v-give" class="view hidden">
    <form id="f-give" class="card" autocomplete="off" novalidate>
      <fieldset>
        <label>預け先（誰の家に）<select name="place"></select></label>
        <label class="hidden" data-role="otherWrap">名前<input name="other" maxlength="30" placeholder="預け先の名前"></label>
        <div class="two">
          <label>袋数<input name="bags" type="number" inputmode="numeric" min="1" max="999" step="1"></label>
          <label>預けた日<input name="date" type="date"></label>
        </div>
        <div class="err" data-role="err"></div>
        <button type="submit" data-label="分配を記録する">分配を記録する</button>
        <div class="ok" data-role="ok"></div>
      </fieldset>
    </form>
    <h2>分配の記録 <span id="sum-give"></span></h2>
    <div id="h-give"></div>
  </section>

  <section id="v-collect" class="view hidden">
    <form id="f-collect" class="card" autocomplete="off" novalidate>
      <fieldset>
        <label>回収元（誰の家から）<select name="place"></select></label>
        <label class="hidden" data-role="otherWrap">名前<input name="other" maxlength="30" placeholder="回収元の名前"></label>
        <div class="two">
          <label>袋数<input name="bags" type="number" inputmode="numeric" min="1" max="999" step="1"></label>
          <label>回収した日<input name="date" type="date"></label>
        </div>
        <div class="err" data-role="err"></div>
        <button type="submit" data-label="回収を記録する">回収を記録する</button>
        <div class="ok" data-role="ok"></div>
      </fieldset>
    </form>
    <h2>回収の記録 <span id="sum-collect"></span></h2>
    <div id="h-collect"></div>
  </section>

  <section id="v-log" class="view hidden">
    <div class="chips">
      <button type="button" class="chip on" data-filter="all">すべて</button>
      <button type="button" class="chip" data-filter="buy">購入</button>
      <button type="button" class="chip" data-filter="give">分配</button>
      <button type="button" class="chip" data-filter="collect">回収</button>
      <button type="button" class="chip order" id="logOrder">新しい順 ⇅</button>
    </div>
    <div id="log"></div>
  </section>

  <div class="foot"><span id="upd"></span><button id="reload" type="button" class="chip">更新</button></div>
</div>
<script src="config.js"></script>
<script>
const API = String(window.KARAAGE_API_URL || "").trim();
const VIEWS = ["stock", "buy", "give", "collect", "log"];
const KLABEL = { buy: "購入", give: "分配", collect: "回収" };
const WD = "日月火水木金土";
const OTHER = "__other__";
const NEW = "__new__";
const POLL_MS = 30000;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const todayStr = () => { const t = new Date(); return new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fmtDate = d => d ? `${+d.slice(5, 7)}/${+d.slice(8, 10)}` : "";
const fmtDay = d => `${fmtDate(d)}（${WD[new Date(d + "T00:00:00").getDay()]}）`;
const hm = t => { const x = new Date(t); return `${x.getHours()}:${String(x.getMinutes()).padStart(2, "0")}`; };
const localDay = t => { const x = new Date(t); return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join(""));

const S = {
  loaded: false, loadErr: false, places: [], records: [], baseDate: "", baseTransit: 0, notes: [],
  addr: null, pw: "", lastSync: 0, writes: 0, refreshing: false,
  armed: null, armedTimer: null, logFilter: "all", logAsc: false,
};

// ---- 通信（Apps Script） ----
async function apiGet() {
  const res = await fetch(API + (API.includes("?") ? "&" : "?") + "action=state", { cache: "no-store" });
  if (!res.ok) throw new Error("http " + res.status);
  return res.json();
}
async function apiPost(body) {
  // text/plain のまま送る（Apps Script は事前確認の通信に対応していないため）
  const res = await fetch(API, { method: "POST", body: JSON.stringify(body) });
  if (!res.ok) throw new Error("http " + res.status);
  return res.json();
}
function applyState(st) {
  if (!st || !st.ok) throw Object.assign(new Error("bad state"), { code: st && st.error });
  S.places = Array.isArray(st.places) ? st.places : [];
  S.records = Array.isArray(st.records) ? st.records : [];
  S.baseDate = st.baseDate || "";
  S.baseTransit = Number(st.baseTransit) || 0;
  S.notes = Array.isArray(st.notes) ? st.notes : [];
  S.loaded = true; S.loadErr = false; S.lastSync = Date.now();
}
async function refresh() {
  if (!API || S.refreshing) return;
  S.refreshing = true;
  const writesAtStart = S.writes;
  try {
    const st = await apiGet();
    if (S.writes === writesAtStart) applyState(st);   // 途中で書き込みがあったら、そちらの結果を優先
  } catch (e) {
    S.loadErr = true;
  } finally {
    S.refreshing = false;
    render();
  }
}
// 通信が切れたときは1回だけやり直す（記録はIDつき、住所は上書きなので、二重にはならない）
async function postRetry(body) {
  try { return await apiPost(body); }
  catch (e) { await sleep(600 + Math.random() * 900); return apiPost(body); }
}
async function post(body) {
  const st = await postRetry(body);
  S.writes++;
  applyState(st);
  render();
  return st;
}

// ---- 計算 ----
function compute() {
  const places = new Map();
  for (const p of S.places) places.set(p.name, { name: p.name, note: p.note || "", hasAddress: !!p.hasAddress, base: Number(p.base) || 0, give: 0, collect: 0 });
  let buy = 0, give = 0, collect = 0;
  for (const r of S.records) {
    if (r.k === "buy") { buy += r.n; continue; }
    if (!places.has(r.t)) places.set(r.t, { name: r.t, note: "", hasAddress: false, base: 0, give: 0, collect: 0 });
    const pl = places.get(r.t);
    if (r.k === "give") { pl.give += r.n; give += r.n; } else { pl.collect += r.n; collect += r.n; }
  }
  const list = [...places.values()];
  for (const pl of list) pl.stock = pl.base + pl.give - pl.collect;
  const baseTotal = S.places.reduce((a, p) => a + (Number(p.base) || 0), 0) + S.baseTransit;
  return { items: S.records, places: list, buy, give, collect, baseTotal,
           free: S.baseTransit + buy - give, total: baseTotal + buy - collect };
}

// ---- 表示 ----
// 都道府県から書かれていなければ東京都をつけて地図を探す
const mapsQuery = a => /^(東京都|北海道|大阪府|京都府|.{2,3}県)/.test(a) ? a : "東京都" + a;

function placeCard(p) {
  let addr;
  if (S.addr && S.addr[p.name]) {
    addr = `<div class="addr">📍 <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapsQuery(S.addr[p.name]))}" target="_blank" rel="noopener">${esc(S.addr[p.name])}</a></div>`;
  } else if (p.hasAddress) {
    addr = `<div class="none">📍 住所はパスワードで表示</div>`;
  } else {
    addr = `<div class="none">${esc(p.note || "住所はあとで登録")}</div>`;
  }
  const flow = (p.give || p.collect)
    ? `<div class="flow">${esc(fmtDate(S.baseDate))}時点 ${p.base}袋${p.give ? `／預け +${p.give}` : ""}${p.collect ? `／回収 −${p.collect}` : ""}</div>` : "";
  return `<div class="card"><div class="row"><span class="name">${esc(p.name)}</span><span class="bags${p.stock < 0 ? " neg" : ""}">${p.stock}袋${p.stock < 0 ? " ⚠️" : ""}</span></div>${addr}${flow}</div>`;
}

function histCard(r) {
  const what = r.k === "buy" ? `業務スーパー ${esc(r.t)}` : esc(r.t);
  const armed = S.armed === r.id;
  return `<div class="card hist"><span class="date">${esc(fmtDate(r.d))}</span><span class="what">${what}</span><span class="bags">${r.n}袋</span>` +
    `<button type="button" class="undo${armed ? " armed" : ""}" data-id="${esc(r.id)}">${armed ? "もう一度で取消" : "取り消す"}</button></div>`;
}

function fillSelect(sel, c, kind) {
  const keep = sel.value;
  sel.textContent = "";
  sel.appendChild(new Option("選んでください", ""));
  const list = kind === "collect" ? [...c.places].sort((a, b) => (b.stock > 0) - (a.stock > 0)) : c.places;
  for (const p of list) sel.appendChild(new Option(`${p.name}（今 ${p.stock}袋）`, p.name));
  sel.appendChild(new Option("その他（名前を入力）", OTHER));
  if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
}

function fillAddrSelect(sel, c) {
  const keep = sel.value;
  sel.textContent = "";
  sel.appendChild(new Option("選んでください", ""));
  for (const p of c.places) sel.appendChild(new Option(p.name + (S.addr && S.addr[p.name] ? "" : "（住所なし）"), p.name));
  sel.appendChild(new Option("新しい家（名前を入力）", NEW));
  if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
}

function renderLog(c) {
  for (const b of document.querySelectorAll("#v-log [data-filter]")) b.classList.toggle("on", b.dataset.filter === S.logFilter);
  $("logOrder").textContent = S.logAsc ? "古い順 ⇅" : "新しい順 ⇅";
  const days = new Map();
  for (const r of c.items) {
    if (!days.has(r.d)) days.set(r.d, { buy: 0, give: 0, collect: 0 });
    days.get(r.d)[r.k] += r.n;
  }
  const endTotal = new Map();
  let run = c.baseTotal;
  for (const d of [...days.keys()].sort()) { const s = days.get(d); run += s.buy - s.collect; endTotal.set(d, run); }
  const dir = S.logAsc ? 1 : -1;
  const rows = c.items.filter(r => S.logFilter === "all" || r.k === S.logFilter)
    .sort((a, b) => (a.d === b.d ? (a.at || 0) - (b.at || 0) : (a.d < b.d ? -1 : 1)) * dir);
  const baseHtml = S.logFilter === "all" && S.baseDate
    ? `<div class="base">${esc(fmtDate(S.baseDate))}時点の基準：在庫合計 ${c.baseTotal}袋（${S.places.filter(p => Number(p.base) > 0).length}か所）</div>` : "";
  let html = S.logAsc ? baseHtml : "", cur = null;
  for (const r of rows) {
    if (r.d !== cur) {
      cur = r.d;
      const s = days.get(r.d);
      const parts = [s.buy ? `購入${s.buy}` : "", s.give ? `分配${s.give}` : "", s.collect ? `回収${s.collect}` : ""].filter(Boolean).join("・");
      html += `<div class="day"><b>${esc(fmtDay(r.d))}</b><span>${esc(parts)}<br>この日の終わりの在庫 ${endTotal.get(r.d)}袋</span></div>`;
    }
    const what = r.k === "buy" ? `業務スーパー ${esc(r.t)}` : `${esc(r.t)}${r.k === "give" ? "へ" : "から"}`;
    const amount = r.k === "buy" ? `+${r.n}袋` : r.k === "collect" ? `−${r.n}袋` : `${r.n}袋`;
    const time = r.at && localDay(r.at) === r.d ? hm(r.at) : "";   // 記録した日と同じ日なら時刻も出す
    html += `<div class="card tl"><span class="badge b-${r.k}">${KLABEL[r.k]}</span><span class="what">${what}</span><span class="bags">${amount}</span><span class="time">${time}</span></div>`;
  }
  if (!rows.length) html += `<div class="empty">${S.loaded ? "まだ記録はありません" : "読み込み中…"}</div>`;
  if (!S.logAsc) html += baseHtml;
  $("log").innerHTML = html;
}

function render() {
  const msgs = [];
  if (!API) msgs.push("アプリの準備がまだです（config.js に Apps Script のURLが入っていません）。");
  else if (!S.loaded && !S.loadErr) msgs.push("読み込み中…");
  else if (S.loadErr) msgs.push(S.loaded ? "最新のデータを読み込めませんでした。表示が古い可能性があります。「更新」を押してください。"
                                         : "データを読み込めませんでした。電波の良いところで「更新」を押してください。");
  $("msg").textContent = msgs.join(" ");
  $("msg").classList.toggle("hidden", !msgs.length);

  const c = compute();
  $("sTotal").textContent = S.loaded ? c.total : "-";
  $("sFree").textContent = S.loaded ? c.free : "-";
  $("sFree").classList.toggle("neg", S.loaded && c.free < 0);
  $("sDone").textContent = S.loaded ? c.collect : "-";
  $("upd").textContent = S.loaded ? `${fmtDate(S.baseDate)}時点の数 ＋ 記録${c.items.length}件 ・ 最終更新 ${hm(S.lastSync)}` : "";

  $("notes").innerHTML = S.notes.length
    ? `<div class="card note"><div class="name">📝 数の確認メモ</div><ul>${S.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>` : "";

  const active = c.places.filter(p => p.stock !== 0), empty = c.places.filter(p => p.stock === 0);
  let html = "";
  if (active.length) html += `<h2>保管中（${active.length}か所）</h2>` + active.map(placeCard).join("");
  if (empty.length) html += `<h2>空（${empty.length}か所）</h2>` + empty.map(placeCard).join("");
  $("list").innerHTML = html;

  $("addrLocked").classList.toggle("hidden", !!S.addr);
  $("addrOpen").classList.toggle("hidden", !S.addr);
  if (S.addr) fillAddrSelect($("f-addr").place, c);

  for (const k of ["buy", "give", "collect"]) {
    const rows = c.items.filter(r => r.k === k).sort((a, b) => a.d === b.d ? (b.at || 0) - (a.at || 0) : (a.d < b.d ? 1 : -1));
    const sum = rows.reduce((a, r) => a + r.n, 0);
    $("sum-" + k).textContent = rows.length ? `（計${sum}袋）` : "";
    $("h-" + k).innerHTML = rows.length ? rows.map(histCard).join("") : `<div class="empty">${S.loaded ? "まだ記録はありません" : "読み込み中…"}</div>`;
    $("f-" + k).querySelector("fieldset").disabled = !(API && S.loaded);
  }
  fillSelect($("f-give").place, c, "give");
  fillSelect($("f-collect").place, c, "collect");

  const dl = $("storeList");
  dl.textContent = "";
  for (const s of new Set(c.items.filter(r => r.k === "buy").map(r => r.t))) dl.appendChild(new Option(s));

  renderLog(c);
}

function showView(v) {
  if (!VIEWS.includes(v)) v = "stock";
  for (const x of VIEWS) $("v-" + x).classList.toggle("hidden", x !== v);
  for (const a of document.querySelectorAll(".tabs a")) a.classList.toggle("on", a.dataset.view === v);
}
const hashView = () => (location.hash || "").slice(1);

// ---- 入力 ----
function formParts(f) {
  return { err: f.querySelector('[data-role="err"]'), ok: f.querySelector('[data-role="ok"]'), btn: f.querySelector('button[type="submit"]') };
}
function resetConfirm(f) {
  const { btn } = formParts(f);
  delete f.dataset.confirm;
  btn.textContent = btn.dataset.label;
}

async function handleSubmit(kind) {
  const f = $("f-" + kind);
  const { err, ok, btn } = formParts(f);
  err.textContent = ""; ok.textContent = "";
  if (!API || !S.loaded) { err.textContent = "まだデータを読み込めていません。"; return; }
  const n = Number(f.bags.value);
  const d = f.date.value;
  let t;
  if (kind === "buy") {
    t = f.store.value.trim().replace(/^業務スーパー\s*/, "");
    if (!t) { err.textContent = "店名を入れてください。"; return; }
  } else {
    t = f.place.value === OTHER ? f.other.value.trim() : f.place.value;
    if (!t) { err.textContent = kind === "give" ? "預け先を選んでください。" : "回収元を選んでください。"; return; }
  }
  if (!Number.isInteger(n) || n < 1 || n > 999) { err.textContent = "袋数を1〜999の数字で入れてください。"; return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { err.textContent = "日付を入れてください。"; return; }

  if (kind !== "buy" && f.dataset.confirm !== "1") {
    const c = compute();
    let warn = "";
    if (kind === "give" && n > c.free) warn = `手元・未分配（${c.free}袋）より多いです。購入をまだ記録していない場合は、そちらも記録してください。`;
    if (kind === "collect") {
      const pl = c.places.find(x => x.name === t);
      const have = pl ? pl.stock : 0;
      if (n > have) warn = `${t}の在庫（${have}袋）より多いです。`;
    }
    if (warn) { err.textContent = warn + "このまま記録する場合は、もう一度押してください。"; f.dataset.confirm = "1"; btn.textContent = "それでも記録する"; return; }
  }

  btn.disabled = true; btn.textContent = "保存中…";
  try {
    const st = await post({ action: "add", id: uid(), k: kind, t, n, d });
    if (!st.ok) throw Object.assign(new Error("rejected"), { code: st.error });
    f.bags.value = "";
    if (kind !== "buy") f.other.value = "";
    const what = kind === "buy" ? `業務スーパー ${t}で${n}袋` : `${t}${kind === "give" ? "に" : "から"}${n}袋`;
    ok.textContent = `記録しました：${what}`;
  } catch (e) {
    err.textContent = e && e.code ? "記録できませんでした（入力内容を確認してください）。" : "保存できませんでした。電波の良いところで、もう一度押してください。";
  } finally {
    btn.disabled = false;
    resetConfirm(f);
  }
}

async function handleUndo(btn) {
  const id = btn.dataset.id;
  if (!id) return;
  if (S.armed !== id) {
    S.armed = id; clearTimeout(S.armedTimer);
    S.armedTimer = setTimeout(() => { S.armed = null; render(); }, 4000);
    render(); return;
  }
  S.armed = null; clearTimeout(S.armedTimer);
  btn.disabled = true; btn.textContent = "取消中…";
  try { await post({ action: "undo", id }); }
  catch (e) { $("msg").textContent = "取り消せませんでした。もう一度お試しください。"; $("msg").classList.remove("hidden"); btn.disabled = false; }
}

async function showAddresses() {
  const pw = $("addrPw").value;
  const err = $("addrErr");
  err.textContent = "";
  if (!pw) { err.textContent = "パスワードを入れてください。"; return; }
  if (!API) { err.textContent = "アプリの準備がまだです。"; return; }
  $("addrGo").disabled = true;
  try {
    const r = await apiPost({ action: "addresses", password: pw });
    if (r.ok) { S.addr = r.addresses || {}; S.pw = pw; $("addrPw").value = ""; render(); return; }
    err.textContent = {
      bad_password: "パスワードが違います。",
      locked: "何度も間違えたため、10分ほど待ってからもう一度試してください。",
      no_password_set: "住所のパスワードがまだ設定されていません。",
    }[r.error] || "住所を読み込めませんでした。";
  } catch (e) {
    err.textContent = "通信できませんでした。電波の良いところで、もう一度押してください。";
  } finally {
    $("addrGo").disabled = false;
  }
}

async function handleAddrSubmit() {
  const f = $("f-addr");
  const { err, ok, btn } = formParts(f);
  err.textContent = ""; ok.textContent = "";
  const isNew = f.place.value === NEW;
  const name = isNew ? f.newname.value.trim() : f.place.value;
  const address = f.address.value.trim();
  if (!name) { err.textContent = isNew ? "名前を入れてください。" : "家を選んでください。"; return; }
  if (!address) { err.textContent = "住所を入れてください。"; return; }
  if (!S.pw) { err.textContent = "もう一度「住所を見る」からパスワードを入れてください。"; return; }
  btn.disabled = true; btn.textContent = "登録中…";
  try {
    const r = await postRetry({ action: "setAddress", password: S.pw, name, address });
    if (!r.ok) {
      err.textContent = {
        bad_password: "パスワードが変わったようです。「隠す」を押してから、もう一度パスワードを入れてください。",
        locked: "何度も間違えたため、10分ほど待ってからもう一度試してください。",
        unknown_action: "住所の登録はまだ使えません（Apps Scriptの更新が必要です）。",
        bad_name: "名前を入れてください。",
        bad_address: "住所を入れてください。",
      }[r.error] || "登録できませんでした。";
      return;
    }
    S.addr = r.addresses || S.addr;
    if (r.state) { S.writes++; applyState(r.state); }
    f.place.value = ""; f.newname.value = ""; f.address.value = "";
    f.querySelector('[data-role="newWrap"]').classList.add("hidden");
    ok.textContent = `登録しました：${name}`;
    render();
  } catch (e) {
    err.textContent = "通信できませんでした。電波の良いところで、もう一度押してください。";
  } finally {
    btn.disabled = false; btn.textContent = btn.dataset.label;
  }
}

// ---- 起動 ----
for (const k of ["buy", "give", "collect"]) {
  const f = $("f-" + k);
  f.date.value = todayStr();
  f.addEventListener("submit", e => { e.preventDefault(); handleSubmit(k); });
  f.addEventListener("input", () => { if (f.dataset.confirm) { resetConfirm(f); formParts(f).err.textContent = ""; } });
  if (f.place) f.place.addEventListener("change", () => {
    f.querySelector('[data-role="otherWrap"]').classList.toggle("hidden", f.place.value !== OTHER);
  });
}
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest(".undo");
  if (b) handleUndo(b);
});
$("v-log").addEventListener("click", e => {
  const f = e.target.closest("[data-filter]");
  if (f) { S.logFilter = f.dataset.filter; render(); return; }
  if (e.target.closest("#logOrder")) { S.logAsc = !S.logAsc; render(); }
});
$("addrGo").addEventListener("click", showAddresses);
$("addrPw").addEventListener("keydown", e => { if (e.key === "Enter") showAddresses(); });
$("addrHide").addEventListener("click", () => { S.addr = null; S.pw = ""; $("addrEdit").open = false; render(); });
$("f-addr").addEventListener("submit", e => { e.preventDefault(); handleAddrSubmit(); });
$("f-addr").place.addEventListener("change", () => {
  const f = $("f-addr");
  const isNew = f.place.value === NEW;
  f.querySelector('[data-role="newWrap"]').classList.toggle("hidden", !isNew);
  f.address.value = !isNew && S.addr && S.addr[f.place.value] ? S.addr[f.place.value] : "";   // 今の住所を入れておくので、直すだけで済む
  formParts(f).ok.textContent = "";
});
$("reload").addEventListener("click", refresh);
window.addEventListener("hashchange", () => showView(hashView()));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, POLL_MS);

showView(hashView());
render();
refresh();
</script>
</body>
</html>
